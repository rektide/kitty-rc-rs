[workspace]
resolver = "2"
members = [
  "protocol/schema",
  "protocol/frame",
  "protocol/commands",
  "access/crypto",
  "access/key-store",
  "apps/cli",
  "access/endpoint",
  "access/discovery",
  "access/credentials",
  "execution/exchange",
  "execution/tokio",
  "control/registry",
  "client",
  "observation/listing",
  "observation/check",
  "tool/verification",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/rektide/kitty-rc-rs"

[workspace.dependencies]
aes-gcm = "0.10"
base85 = "2.0"
base64 = "0.22"
bon = "3.5"
clap = { version = "4.0", features = ["derive"] }
kitty-rc-schema = { path = "protocol/schema" }
kitty-rc-commands = { path = "protocol/commands" }
kitty-rc-crypto = { path = "access/crypto" }
kitty-rc-frame = { path = "protocol/frame" }
kitty-rc-endpoint = { path = "access/endpoint" }
kitty-rc-discovery = { path = "access/discovery" }
kitty-rc-credentials = { path = "access/credentials" }
kitty-rc-exchange = { path = "execution/exchange" }
kitty-rc-tokio = { path = "execution/tokio" }
kitty-rc-registry = { path = "control/registry" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
futures-util = "0.3"
kitty-rc-key-store = { path = "access/key-store" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
