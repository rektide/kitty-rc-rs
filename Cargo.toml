[workspace]
resolver = "2"
members = [
  "protocol/schema",
  "protocol/frame",
  "protocol/commands",
  "access/crypto",
  "access/key-store",
  "apps/cli",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rektide/kitty-rc-rs"

[workspace.dependencies]
aes-gcm = "0.10"
base85 = "2.0"
bon = "3.5"
clap = { version = "4.0", features = ["derive"] }
kitty-rc-schema = { path = "protocol/schema" }
kitty-rc-key-store = { path = "access/key-store" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
